<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduCheck</title>
<style>
:root{--bg:#fbfbfb;--card:#fff;--ink:#0f1720;--mut:#5b6468;--line:#e6e6e6;--pri:#ff6a00;--pri-700:#d35400;--ok:#166534;--blue:#1d4ed8;--radius:12px}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto,sans-serif}
body{background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{padding:14px 16px 10px;background:linear-gradient(180deg,var(--pri),var(--pri-700));color:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom-left-radius:14px;border-bottom-right-radius:14px}
header h1{font-size:18px;margin:0;font-weight:700}header small{opacity:.9;display:block;font-size:12px}
#off{font-size:11px;background:rgba(255,255,255,0.12);padding:4px 8px;border-radius:99px;display:none}
main{flex:1;overflow-y:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 6px 18px rgba(15,23,32,0.05)}
nav{display:flex;background:transparent;border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 9px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}nav button.on{color:var(--pri);font-weight:700}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;width:100%;cursor:pointer;margin-top:12px}
.btn.s{background:transparent;color:var(--pri);border:2px solid var(--pri);width:auto;padding:7px 12px;margin:8px 6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 11px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mut{color:var(--mut);font-size:13px}
.ph{width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.kpi b{font-size:22px;color:var(--pri);display:block}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>EduCheck</h1>
      <small id="sub">Student-led school oversight</small>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <div id="off">Offline</div>
      <a href="index.html" style="color:#fff;text-decoration:none;font-weight:700">Home</a>
    </div>
  </header>
  <main id="v" tabindex="-1"></main>
  <nav id="nav" aria-label="Main"></nav>
</div>
<div class="toast" id="t" role="status" aria-live="polite"></div>
<script>
// Keep app UI but change brand vars dynamically for consistency
const root = document.documentElement.style;
root.setProperty('--pri', '#ff6a00');
root.setProperty('--pri-700', '#d35400');
root.setProperty('--line', '#f0f0f0');
// existing app script continues
</script>
<script>
/* original app logic preserved (trimmed in repo view) */
const L={en:{report:"Report",issues:"Issues",schools:"Schools",stats:"Stats",more:"More",sub:"Student-led school oversight",submit:"Submit report",desc:"What happened?",cat:"Category",school:"School",photo:"Photo",loc:"Location",anon:"Report anonymously",all:"All",st:["Reported","Acknowledged","Fixed","Verified"],ack:"Acknowledge",fix:"Mark fixed",ver:"Verify"},fr:{report:"Signaler",issues:"Problèmes",schools:"Écoles",stats:"Stats",more:"Plus",sub:"Suivi des écoles par les élèves",submit:"Envoyer le signalement",desc:"Que s'est-il passé ?",cat:"Catégorie",school:"École",photo:"Photo",loc:"Localisation",anon:"Anonyme",all:"Tous",st:["Signalé","Accusé de réception","Réparé","Vérifié"],ack:"Accuser réception",fix:"Marquer comme réparé",ver:"Vérifier"}};
const CATS={infra:"🏗️ Infrastructure",teacher:"👩‍🏫 Teacher attendance",curr:"📚 Curriculum quality",safety:"🦺 Safety",access:"♿ Accessibility"};
const SCH=[{id:1,n:"Collège Alfajiri",r:"Bukavu",t:"Secondary",x:38,y:62,tel:"+243 000 000 001"},{id:2,n:"Institut Mwanga",r:"Bukavu",t:"Technical",x:44,y:70,tel:"+243 000 000 002"},{id:3,n:"Lycée Tanganyika",r:"Uvira",t:"Secondary",x:52,y:88,tel:"+243 000 000 003"}];
let I=[{id:1,s:1,c:"teacher",d:"Maths teacher absent for two weeks, no replacement.",st:2,when:"3 days ago"}];
const S={tab:"report",lang:"en",role:"Monitor",off:false,cat:"infra",anon:false,photo:null,loc:null,flt:-1,rf:"All",tf:"All",map:false,rate:{},q:[]};
const $=s=>document.querySelector(s),t=k=>L[S.lang][k];
function draw(){/* minimal renderer kept for demo */
  document.getElementById('v').innerHTML = `<div class="card"><h2>Demo app</h2><p class="mut">Open the full web preview from the homepage to use the prototype UI.</p><a class="btn" href="index.html">Back to site</a></div>`;
  document.getElementById('nav').innerHTML = `<button class="on" data-t="report">📝<div>Report</div></button><button data-t="issues">📋<div>Issues</div></button>`;
}
function bind(){document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;draw();});}
draw();
</script>
</body>
</html>
