<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduCheck</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#16221b;--mut:#5d6b62;--line:#dfe5df;--pri:#0f6b4a;--pri2:#e3f2ea;--warn:#b45309;--bad:#b91c1c;--ok:#166534;--blue:#1d4ed8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--ink:#e8efe9;--mut:#9aaa9f;--line:#27352c;--pri:#4cc38a;--pri2:#173326;--warn:#f0a85a;--bad:#f28b8b;--ok:#6fd49a;--blue:#8fb0ff}}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--ink:#e8efe9;--mut:#9aaa9f;--line:#27352c;--pri:#4cc38a;--pri2:#173326;--warn:#f0a85a;--bad:#f28b8b;--ok:#6fd49a;--blue:#8fb0ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{padding:14px 16px 10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) header{color:#07150e}}
header h1{font-size:19px;margin:0}header small{opacity:.85;display:block;font-size:12px}
#off{font-size:11px;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:99px;display:none}
main{flex:1;overflow-y:auto;padding:14px 14px 20px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 9px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:0 0 6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 11px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#07150e}}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;width:100%;cursor:pointer;margin-top:12px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#07150e}}
.btn.s{background:var(--pri2);color:var(--pri);width:auto;padding:7px 12px;margin:8px 6px 0 0;font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:700;white-space:nowrap}
.steps{display:flex;gap:4px;margin:10px 0 2px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.f{background:var(--pri)}
.slabels{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar b{display:block;height:100%;background:var(--pri)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.kpi b{font-size:24px;color:var(--pri);display:block}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;color:var(--ink);padding:7px;border-radius:8px;cursor:pointer;font:inherit}.seg .on{background:var(--card);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.star{font-size:26px;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px}.star.on{color:#e2a400}
img.ph{width:100%;max-height:150px;object-fit:cover;border-radius:10px;margin-top:8px}
pre{white-space:pre-wrap;font-size:11px;background:var(--bg);padding:8px;border-radius:8px;max-height:160px;overflow:auto}
.map{width:100%;background:var(--pri2);border-radius:14px;border:1px solid var(--line)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
</style>
</head>
<body>
<div class="app">
<header><div><h1>EduCheck</h1><small id="sub"></small></div><span id="off">Offline</span></header>
<main id="v" tabindex="-1"></main>
<nav id="nav" aria-label="Main"></nav>
</div>
<div class="toast" id="t" role="status" aria-live="polite"></div>
<script>
const L={
en:{report:"Report",issues:"Issues",schools:"Schools",stats:"Stats",more:"More",sub:"Student-led school oversight",submit:"Submit report",desc:"What happened?",cat:"Category",school:"School",photo:"Add photo",loc:"Add location",anon:"Report anonymously",all:"All",ack:"Acknowledge",fix:"Mark fixed",ver:"Verify fix",role:"Your role",lang:"Language",offline:"Offline mode",st:["Reported","Acknowledged","Fixed","Verified"]},
fr:{report:"Signaler",issues:"Problèmes",schools:"Écoles",stats:"Stats",more:"Plus",sub:"Suivi des écoles par les élèves",submit:"Envoyer le signalement",desc:"Que s'est-il passé ?",cat:"Catégorie",school:"École",photo:"Ajouter une photo",loc:"Ajouter la position",anon:"Signaler anonymement",all:"Tous",ack:"Accuser réception",fix:"Marquer résolu",ver:"Vérifier la solution",role:"Votre rôle",lang:"Langue",offline:"Mode hors ligne",st:["Signalé","Reçu","Résolu","Vérifié"]},
ln:{report:"Koyebisa",issues:"Mikakatano",schools:"Eskuele",stats:"Mitángo",more:"Mingi",sub:"Kotala eskuele na bayekoli",submit:"Tinda",desc:"Nini esalemaki?",cat:"Lolenge",school:"Eskuele",photo:"Bakisa foto",loc:"Bakisa esika",anon:"Koyebisa na nkombo te",all:"Nyonso",ack:"Zwa",fix:"Ebongisami",ver:"Tala",role:"Mosala na yo",lang:"Lokota",offline:"Offline",st:["Eyebisami","Ezwami","Ebongisami","Etalami"]},
kg:{report:"Zabisa",issues:"Mambu",schools:"Sikola",stats:"Mbalu",more:"Mpe",sub:"Tala sikola ya bana",submit:"Tinda",desc:"Nki salamaka?",cat:"Kikuma",school:"Sikola",photo:"Bakisa foto",loc:"Bakisa kisika",anon:"Zabisa ata zina ve",all:"Yonso",ack:"Zaba",fix:"Bonga",ver:"Tala",role:"Kisalu",lang:"Lokota",offline:"Offline",st:["Zabisama","Zabama","Bongisama","Talama"]}};
const CATS={infra:"🏗️ Infrastructure",teacher:"👩‍🏫 Teacher attendance",curr:"📚 Curriculum quality",safety:"🦺 Safety",access:"♿ Accessibility"};
const SCH=[
{id:1,n:"Collège Alfajiri",r:"Bukavu",t:"Secondary",x:38,y:62,tel:"+243 000 000 001"},
{id:2,n:"Institut Mwanga",r:"Bukavu",t:"Technical",x:44,y:70,tel:"+243 000 000 002"},
{id:3,n:"Lycée Tanganyika",r:"Uvira",t:"Secondary",x:52,y:88,tel:"+243 000 000 003"},
{id:4,n:"EP Umoja",r:"Uvira",t:"Primary",x:58,y:80,tel:"+243 000 000 004"},
{id:5,n:"Athénée de la Gombe",r:"Kinshasa",t:"Secondary",x:12,y:22,tel:"+243 000 000 005"},
{id:6,n:"Institut Kimbanseke",r:"Kinshasa",t:"Technical",x:20,y:30,tel:"+243 000 000 006"}];
let I=[
{id:1,s:1,c:"teacher",d:"Maths teacher absent for two weeks, no replacement.",st:2,when:"3 days ago"},
{id:2,s:3,c:"infra",d:"No clean drinking water; tap broken since September.",st:1,when:"5 days ago"},
{id:3,s:5,c:"access",d:"Ramp to the library blocked, wheelchair users cannot enter.",st:0,when:"1 day ago"},
{id:4,s:2,c:"safety",d:"Broken fence near road, pupils cross unsupervised.",st:3,when:"3 weeks ago"},
{id:5,s:4,c:"curr",d:"Textbooks delivered but kept in the office, not given to pupils.",st:1,when:"1 week ago"},
{id:6,s:6,c:"infra",d:"Roof leaks in two classrooms during rain.",st:0,when:"2 days ago"},
{id:7,s:1,c:"infra",d:"Latrines locked and unusable for girls.",st:3,when:"1 month ago"}];
const S={tab:"report",lang:"en",role:"Monitor",off:false,cat:"infra",anon:false,photo:null,loc:null,flt:-1,rf:"All",tf:"All",map:false,rate:{},q:[]};
const $=s=>document.querySelector(s),t=k=>L[S.lang][k];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const e=$("#t");e.textContent=m;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
const TABS=[["report","📝"],["issues","📋"],["schools","🏫"],["stats","📊"],["more","⚙️"]];
function draw(){
 $("#sub").textContent=t("sub");$("#off").style.display=S.off?"inline-block":"none";
 $("#nav").innerHTML=TABS.map(([k,i])=>`<button data-t="${k}" class="${S.tab==k?"on":""}" ${S.tab==k?'aria-current="page"':""}><span aria-hidden="true">${i}</span>${t(k)}</button>`).join("");
 $("#v").innerHTML=V[S.tab]();
 bind();
}
function opts(a,v){return a.map(x=>`<option ${x==v?"selected":""}>${esc(x)}</option>`).join("")}
const sOpt=()=>SCH.map(s=>`<option value="${s.id}">${esc(s.n)} — ${s.r}</option>`).join("");
function issueCard(i){
 const s=SCH.find(x=>x.id==i.s),T=t("st");
 let act="";
 if(S.role=="School administrator"){if(i.st==0)act=`<button class="btn s" data-a="1" data-i="${i.id}">${t("ack")}</button>`;if(i.st==1)act=`<button class="btn s" data-a="2" data-i="${i.id}">${t("fix")}</button>`}
 if(S.role=="Monitor"&&i.st==2)act=`<button class="btn s" data-a="3" data-i="${i.id}">${t("ver")}</button>`;
 return `<div class="card"><div class="row"><h3>${esc(s.n)}</h3><span class="tag">${T[i.st]}</span></div>
 <div class="mut">${CATS[i.c]} · ${i.when}${i.pend?" · ⏳ pending sync":""}</div><p style="margin:6px 0">${esc(i.d)}</p>${i.img?`<img class="ph" alt="Attached photo" src="${i.img}">`:""}
 <div class="steps">${T.map((_,k)=>`<i class="${k<=i.st?"f":""}"></i>`).join("")}</div><div class="slabels">${T.map(x=>`<span>${x}</span>`).join("")}</div>${act}</div>`}
const V={
report(){return `<h2>${t("report")}</h2><div class="card">
<label>${t("cat")}</label><div class="chips" role="group">${Object.entries(CATS).map(([k,v])=>`<button class="chip ${S.cat==k?"on":""}" data-c="${k}" aria-pressed="${S.cat==k}">${v}</button>`).join("")}</div>
<label for="sc">${t("school")}</label><select id="sc">${sOpt()}</select>
<label for="ds">${t("desc")}</label><textarea id="ds" placeholder="…"></textarea>
<label for="ph">${t("photo")}</label><input type="file" id="ph" accept="image/*" capture="environment">${S.photo?`<img class="ph" alt="Preview" src="${S.photo}">`:""}
<button class="btn s" id="lc" style="margin-top:12px">📍 ${t("loc")}</button><span class="mut">${S.loc||""}</span>
<div class="sw"><label for="an" style="margin:0">${t("anon")}</label><input type="checkbox" id="an" style="width:22px;height:22px" ${S.anon?"checked":""}></div>
<button class="btn" id="go">${t("submit")}</button></div>
<p class="mut">${S.q.length?`⏳ ${S.q.length} report(s) waiting to sync.`:"Reports move from Reported → Acknowledged → Fixed → Verified."}</p>`},
issues(){const T=t("st");return `<h2>${t("issues")}</h2><div class="chips" style="margin-bottom:10px"><button class="chip ${S.flt<0?"on":""}" data-f="-1">${t("all")}</button>${T.map((x,k)=>`<button class="chip ${S.flt==k?"on":""}" data-f="${k}">${x}</button>`).join("")}</div>`+I.filter(i=>S.flt<0||i.st==S.flt).map(issueCard).join("")},
schools(){const R=["All","Bukavu","Uvira","Kinshasa"],Y=["All","Primary","Secondary","Technical"];
 const F=SCH.filter(s=>(S.rf=="All"||s.r==S.rf)&&(S.tf=="All"||s.t==S.tf)),op=s=>I.filter(i=>i.s==s.id&&i.st<3).length;
 const list=F.map(s=>`<div class="card"><div class="row"><h3>${esc(s.n)}</h3><span class="tag">${op(s)} open</span></div><div class="mut">${s.t} · ${s.r}</div><div class="mut">☎ ${s.tel}</div>
 <div class="mut" style="margin-top:4px">${I.filter(i=>i.s==s.id&&i.st==3).length} verified fixes · ${I.filter(i=>i.s==s.id).length} reports</div></div>`).join("");
 const map=`<svg class="map" viewBox="0 0 100 100" role="img" aria-label="Map of schools"><text x="4" y="10" font-size="4" fill="currentColor" opacity=".6">Kinshasa</text><text x="60" y="94" font-size="4" fill="currentColor" opacity=".6">Uvira</text><text x="26" y="58" font-size="4" fill="currentColor" opacity=".6">Bukavu</text>${F.map(s=>`<circle cx="${s.x}" cy="${s.y}" r="${3+op(s)*1.2}" fill="${op(s)?"#b91c1c":"#166534"}" opacity=".85"/><text x="${s.x+4}" y="${s.y+1}" font-size="3" fill="currentColor">${esc(s.n.split(" ").slice(-1)[0])}</text>`).join("")}</svg><p class="mut">Red = open issues, green = none. Schematic map.</p>`;
 return `<h2>${t("schools")}</h2><div class="row"><select id="rf" aria-label="Region">${opts(R,S.rf)}</select><select id="tf" aria-label="Type">${opts(Y,S.tf)}</select></div><div class="seg" style="margin-top:10px"><button data-m="0" class="${S.map?"":"on"}">List</button><button data-m="1" class="${S.map?"on":""}">Map</button></div>${S.map?map:list}`},
stats(){const n=I.length,res=I.filter(i=>i.st>=2).length,ver=I.filter(i=>i.st==3).length;
 const by=Object.keys(CATS).map(k=>[CATS[k],I.filter(i=>i.c==k).length]);
 return `<h2>${t("stats")}</h2><div class="kpis"><div class="kpi"><b>${n}</b>Total reports</div><div class="kpi"><b>${Math.round(res/n*100)}%</b>Resolution rate</div><div class="kpi"><b>${I.filter(i=>i.st==0).length}</b>Awaiting response</div><div class="kpi"><b>${ver}</b>Verified fixes</div></div>
 <div class="card"><h3>By category</h3>${by.map(([l,c])=>`<div class="row mut"><span>${l}</span><span>${c}</span></div><div class="bar"><b style="width:${c/n*100}%"></b></div><div style="height:6px"></div>`).join("")}</div>
 <div class="card"><h3>By region</h3>${["Bukavu","Uvira","Kinshasa"].map(r=>{const c=I.filter(i=>SCH.find(s=>s.id==i.s).r==r).length;return `<div class="row mut"><span>${r}</span><span>${c}</span></div><div class="bar"><b style="width:${c/n*100}%"></b></div><div style="height:6px"></div>`}).join("")}</div>
 <button class="btn" id="ex">Export CSV</button><div id="exo"></div><p class="mut">Demo data. Public viewers see anonymized aggregates only.</p>`},
more(){const R=["Monitor","School administrator","CERC analyst","Public viewer"];
 return `<h2>${t("more")}</h2><div class="card"><label for="ro" style="margin-top:0">${t("role")}</label><select id="ro">${opts(R,S.role)}</select>
 <label for="lg">${t("lang")}</label><select id="lg">${[["en","English"],["fr","Français"],["ln","Lingála"],["kg","Kikongo"]].map(([k,v])=>`<option value="${k}" ${S.lang==k?"selected":""}>${v}</option>`).join("")}</select>
 <div class="sw"><label for="of" style="margin:0">${t("offline")}</label><input type="checkbox" id="of" style="width:22px;height:22px" ${S.off?"checked":""}></div>
 <p class="mut">Local-language labels are draft translations to be reviewed by native speakers.</p></div>
 <div class="card"><h3>Relevance feedback</h3><p class="mut" style="margin-top:0">Rate your lessons</p>${[["content","Course content"],["methods","Teaching methods"],["culture","Cultural relevance"],["practice","Practical application"]].map(([k,l])=>`<div class="row"><span>${l}</span><span>${[1,2,3,4,5].map(n=>`<button class="star ${(S.rate[k]||0)>=n?"on":""}" data-r="${k}" data-n="${n}" aria-label="${l}: ${n} of 5">★</button>`).join("")}</span></div>`).join("")}
 <button class="btn s" id="rs">Send feedback</button></div>
 <div class="card"><h3>About</h3><p class="mut" style="margin:0">Inspired by CERC's Integrity Clubs: students collect school-level evidence and advocate with officials. 204 secondary schools, 3,060 trained monitors (2018–2022).</p></div>`}};
function bind(){
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;draw();$("#v").scrollTop=0});
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;keep();draw()});
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.flt=+b.dataset.f;draw()});
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.map=b.dataset.m=="1";draw()});
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{I.find(i=>i.id==b.dataset.i).st=+b.dataset.a;toast("Status updated");draw()});
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.rate[b.dataset.r]=+b.dataset.n;draw()});
 const on=(id,f,ev="change")=>{const e=document.getElementById(id);if(e)e.addEventListener(ev,f)};
 on("rf",e=>{S.rf=e.target.value;draw()});on("tf",e=>{S.tf=e.target.value;draw()});
 on("ro",e=>{S.role=e.target.value;toast(S.role);});on("lg",e=>{S.lang=e.target.value;document.documentElement.lang=S.lang;draw()});
 on("of",e=>{S.off=e.target.checked;if(!S.off&&S.q.length){S.q.forEach(i=>i.pend=false);toast(S.q.length+" report(s) synced");S.q=[]}draw()});
 on("an",e=>S.anon=e.target.checked);
 on("ph",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{keep();S.photo=r.result;draw()};r.readAsDataURL(f)});
 on("lc",()=>{if(!navigator.geolocation){toast("Location unavailable");return}navigator.geolocation.getCurrentPosition(p=>{keep();S.loc=p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4);draw()},()=>toast("Location denied"))},"click");
 on("go",()=>{const d=$("#ds").value.trim();if(d.length<8){toast("Please describe the issue");return}
  const i={id:Date.now(),s:+$("#sc").value,c:S.cat,d,st:0,when:"just now",img:S.photo,pend:S.off};I.unshift(i);if(S.off)S.q.push(i);
  S.photo=null;S.loc=null;S.anon=false;toast(S.off?"Saved offline — will sync later":"Report sent");S.tab="issues";S.flt=-1;draw()},"click");
 on("ex",()=>{const csv="id,school,category,status\n"+I.map(i=>[i.id,SCH.find(s=>s.id==i.s).n,i.c,t("st")[i.st]].join(",")).join("\n");
  $("#exo").innerHTML=`<pre>${esc(csv)}</pre><button class="btn s" id="cp">Copy</button>`;
  $("#cp").onclick=()=>{try{navigator.clipboard.writeText(csv);toast("Copied")}catch(e){toast("Select and copy manually")}}},"click");
 on("rs",()=>toast("Thank you for your feedback"),"click");
}
function keep(){const d=document.getElementById("ds");if(d)S.draft=d.value}
const _d=draw;draw=function(){_d();const d=document.getElementById("ds");if(d&&S.draft)d.value=S.draft;if(S.tab!="report")return};
draw();
</script>
</body>
</html>
